<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812">
  <defs>
    <style>
      text { font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="375" height="812" fill="#f8f9fa"/>

  <!-- Status Bar -->
  <rect width="375" height="44" fill="#ffffff"/>
  <text x="187" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1f1f">9:41</text>

  <!-- Master Tabs -->
  <rect y="44" width="375" height="44" fill="#ffffff"/>
  <rect x="16" y="52" width="56" height="28" rx="14" fill="#1a73e8"/>
  <text x="44" y="71" text-anchor="middle" font-size="13" font-weight="500" fill="#ffffff">巴菲特</text>
  <rect x="80" y="52" width="44" height="28" rx="14" fill="#f8f9fa"/>
  <text x="102" y="71" text-anchor="middle" font-size="13" font-weight="500" fill="#5f6368">芒格</text>
  <line x1="0" y1="88" x2="375" y2="88" stroke="#e8eaed"/>

  <!-- User Message 1 -->
  <rect x="100" y="108" width="255" height="40" rx="12" fill="#1a73e8"/>
  <text x="227" y="133" text-anchor="middle" font-size="14" fill="#ffffff">苹果现在值得长期持有吗？</text>

  <!-- Assistant Reply -->
  <circle cx="30" cy="172" r="16" fill="#e8f0fe"/>
  <text x="30" y="177" text-anchor="middle" font-size="12" font-weight="600" fill="#1a73e8">巴</text>

  <rect x="54" y="160" width="296" height="320" rx="12" fill="#ffffff"/>
  <!-- Reply content -->
  <text x="70" y="184" font-size="14" fill="#1f1f1f">从价值投资的角度来看这个问题：</text>

  <text x="70" y="214" font-size="14" font-weight="600" fill="#1f1f1f">首先，我们需要关注的是企业的</text>
  <text x="70" y="234" font-size="14" font-weight="600" fill="#1f1f1f">商业模式是否具有持久的竞争</text>
  <text x="70" y="254" font-size="14" fill="#1f1f1f">优势，也就是我常说的"护城河"。</text>

  <text x="70" y="284" font-size="14" fill="#1f1f1f">一家好的企业应该具备：</text>
  <text x="82" y="306" font-size="13" fill="#5f6368">• 强大的品牌效应或网络效应</text>
  <text x="82" y="326" font-size="13" fill="#5f6368">• 较高的客户转换成本</text>
  <text x="82" y="346" font-size="13" fill="#5f6368">• 持续的成本优势</text>
  <text x="82" y="366" font-size="13" fill="#5f6368">• 优秀且诚实的管理层</text>

  <text x="70" y="396" font-size="14" fill="#1f1f1f">以合理的价格买入一家伟大的</text>
  <text x="70" y="416" font-size="14" fill="#1f1f1f">公司，远胜于以便宜的价格买入</text>
  <text x="70" y="436" font-size="14" fill="#1f1f1f">一家平庸的公司。</text>

  <!-- Risk Warning -->
  <rect x="70" y="448" width="264" height="26" rx="6" fill="#fff8e1"/>
  <text x="78" y="466" font-size="11" fill="#e37400">⚠️ 仅供参考，不构成投资建议</text>

  <!-- User Message 2 -->
  <rect x="80" y="500" width="275" height="40" rx="12" fill="#1a73e8"/>
  <text x="217" y="525" text-anchor="middle" font-size="14" fill="#ffffff">苹果的护城河具体体现在哪些方面？</text>

  <!-- Input Bar -->
  <rect y="700" width="375" height="56" fill="#ffffff"/>
  <line x1="0" y1="700" x2="375" y2="700" stroke="#e8eaed"/>
  <rect x="16" y="708" width="270" height="40" rx="20" fill="#ffffff" stroke="#e8eaed"/>
  <text x="36" y="733" font-size="14" fill="#9aa0a6">输入你的问题...</text>
  <rect x="296" y="708" width="64" height="40" rx="20" fill="#1a73e8"/>
  <text x="328" y="733" text-anchor="middle" font-size="14" font-weight="500" fill="#ffffff">发送</text>

  <!-- Tab Bar -->
  <rect y="756" width="375" height="56" fill="#ffffff"/>
  <line x1="0" y1="756" x2="375" y2="756" stroke="#e8eaed"/>
  <text x="62" y="778" text-anchor="middle" font-size="20">🏠</text>
  <text x="62" y="796" text-anchor="middle" font-size="11" fill="#9aa0a6">首页</text>
  <text x="187" y="778" text-anchor="middle" font-size="20">💬</text>
  <text x="187" y="796" text-anchor="middle" font-size="11" font-weight="600" fill="#1a73e8">咨询</text>
  <text x="312" y="778" text-anchor="middle" font-size="20">👤</text>
  <text x="312" y="796" text-anchor="middle" font-size="11" fill="#9aa0a6">我的</text>
</svg>
