<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812">
  <defs>
    <style>
      text { font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="375" height="812" fill="#ffffff"/>

  <!-- Status Bar -->
  <text x="187" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1f1f">9:41</text>

  <!-- Title -->
  <text x="20" y="90" font-size="22" font-weight="700" fill="#1f1f1f">选择投资大师</text>
  <text x="20" y="114" font-size="14" fill="#5f6368">添加你感兴趣的投资大师，以他们的视角获取投资分析</text>

  <!-- Master Card Grid: 2x2 -->
  <!-- Card 1: 巴菲特 (selected) -->
  <rect x="20" y="140" width="160" height="150" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <circle cx="100" cy="180" r="24" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1"/>
  <text x="100" y="187" text-anchor="middle" font-size="18" font-weight="700" fill="#1a73e8">巴</text>
  <text x="100" y="222" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1f1f">巴菲特</text>
  <text x="100" y="242" text-anchor="middle" font-size="11" fill="#5f6368">重商业模式、护城河</text>
  <text x="100" y="258" text-anchor="middle" font-size="11" fill="#5f6368">长期主义、管理层质量</text>
  <!-- Check -->
  <circle cx="164" cy="156" r="11" fill="#1a73e8"/>
  <text x="164" y="161" text-anchor="middle" font-size="12" fill="#ffffff">✓</text>

  <!-- Card 2: 芒格 (selected) -->
  <rect x="195" y="140" width="160" height="150" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <circle cx="275" cy="180" r="24" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1"/>
  <text x="275" y="187" text-anchor="middle" font-size="18" font-weight="700" fill="#1a73e8">芒</text>
  <text x="275" y="222" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1f1f">芒格</text>
  <text x="275" y="242" text-anchor="middle" font-size="11" fill="#5f6368">重多元思维模型</text>
  <text x="275" y="258" text-anchor="middle" font-size="11" fill="#5f6368">理性决策、逆向思考</text>
  <circle cx="339" cy="156" r="11" fill="#1a73e8"/>
  <text x="339" y="161" text-anchor="middle" font-size="12" fill="#ffffff">✓</text>

  <!-- Card 3: 段永平 (unselected) -->
  <rect x="20" y="304" width="160" height="150" rx="12" fill="#f8f9fa" stroke="transparent" stroke-width="2"/>
  <circle cx="100" cy="344" r="24" fill="#e8f0fe"/>
  <text x="100" y="351" text-anchor="middle" font-size="18" font-weight="700" fill="#1a73e8">段</text>
  <text x="100" y="386" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1f1f">段永平</text>
  <text x="100" y="406" text-anchor="middle" font-size="11" fill="#5f6368">重商业常识、长期持有</text>
  <text x="100" y="422" text-anchor="middle" font-size="11" fill="#5f6368">好生意好价格</text>

  <!-- Card 4: 李录 (unselected) -->
  <rect x="195" y="304" width="160" height="150" rx="12" fill="#f8f9fa" stroke="transparent" stroke-width="2"/>
  <circle cx="275" cy="344" r="24" fill="#e8f0fe"/>
  <text x="275" y="351" text-anchor="middle" font-size="18" font-weight="700" fill="#1a73e8">李</text>
  <text x="275" y="386" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1f1f">李录</text>
  <text x="275" y="406" text-anchor="middle" font-size="11" fill="#5f6368">重价值发现、时代机会</text>
  <text x="275" y="422" text-anchor="middle" font-size="11" fill="#5f6368">中国企业认知</text>

  <!-- Submit Button -->
  <rect x="20" y="500" width="335" height="48" rx="8" fill="#1a73e8"/>
  <text x="187" y="530" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">开始咨询（2）</text>

  <!-- Annotation -->
  <rect x="0" y="760" width="375" height="52" fill="#f8f9fa"/>
  <text x="187" y="790" text-anchor="middle" font-size="12" fill="#5f6368">06 - 咨询 Onboarding（选择投资大师）</text>
</svg>
