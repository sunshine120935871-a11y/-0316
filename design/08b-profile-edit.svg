<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812">
  <defs>
    <style>
      text { font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="375" height="812" fill="#f8f9fa"/>

  <!-- Status Bar -->
  <rect width="375" height="44" fill="#ffffff"/>
  <text x="187" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1f1f">9:41</text>

  <!-- Profile Card (editing state) -->
  <rect y="44" width="375" height="340" fill="#ffffff"/>

  <!-- Avatar -->
  <circle cx="187" cy="110" r="36" fill="#e8f0fe"/>
  <text x="187" y="120" text-anchor="middle" font-size="28" font-weight="700" fill="#1a73e8">张</text>

  <!-- Edit Form -->
  <!-- Name -->
  <text x="40" y="176" font-size="13" font-weight="500" fill="#5f6368">姓名</text>
  <rect x="40" y="184" width="295" height="40" rx="8" fill="#ffffff" stroke="#1a73e8"/>
  <text x="56" y="210" font-size="14" fill="#1f1f1f">张三</text>

  <!-- Bio -->
  <text x="40" y="250" font-size="13" font-weight="500" fill="#5f6368">个签</text>
  <rect x="40" y="258" width="295" height="56" rx="8" fill="#ffffff" stroke="#e8eaed"/>
  <text x="56" y="282" font-size="14" fill="#1f1f1f">长期价值投资者，关注消费和科技赛道</text>

  <!-- Action Buttons -->
  <rect x="40" y="334" width="142" height="40" rx="8" fill="#1a73e8"/>
