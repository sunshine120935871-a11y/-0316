<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812">
  <defs>
    <style>
      text { font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="375" height="812" fill="#f8f9fa"/>

  <!-- Status Bar -->
  <rect width="375" height="44" fill="#ffffff"/>
  <text x="187" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1f1f">9:41</text>

  <!-- Search Header -->
  <rect y="44" width="375" height="52" fill="#ffffff"/>
  <text x="20" y="76" font-size="18" fill="#1f1f1f">←</text>
  <rect x="48" y="54" width="252" height="36" rx="18" fill="#f8f9fa" stroke="#e8eaed"/>
  <text x="66" y="78" font-size="14" fill="#9aa0a6">搜索帖子、公司...</text>
  <text x="325" y="78" text-anchor="middle" font-size="14" font-weight="500" fill="#1a73e8">搜索</text>
  <line x1="0" y1="96" x2="375" y2="96" stroke="#e8eaed"/>

  <!-- History Section -->
  <text x="20" y="128" font-size="14" fill="#5f6368">历史搜索</text>
  <text x="340" y="128" text-anchor="middle" font-size="12" fill="#9aa0a6">清空</text>

  <!-- History Tags -->
  <rect x="20" y="142" width="52" height="30" rx="15" fill="#ffffff" stroke="#e8eaed"/>
  <text x="46" y="162" text-anchor="middle" font-size="13" fill="#1f1f1f">财报</text>
  <rect x="80" y="142" width="52" height="30" rx="15" fill="#ffffff" stroke="#e8eaed"/>
  <text x="106" y="162" text-anchor="middle" font-size="13" fill="#1f1f1f">苹果</text>
  <rect x="140" y="142" width="76" height="30" rx="15" fill="#ffffff" stroke="#e8eaed"/>
  <text x="178" y="162" text-anchor="middle" font-size="13" fill="#1f1f1f">风险提示</text>
  <rect x="224" y="142" width="64" height="30" rx="15" fill="#ffffff" stroke="#e8eaed"/>
  <text x="256" y="162" text-anchor="middle" font-size="13" fill="#1f1f1f">特斯拉</text>

  <rect x="20" y="180" width="76" height="30" rx="15" fill="#ffffff" stroke="#e8eaed"/>
  <text x="58" y="200" text-anchor="middle" font-size="13" fill="#1f1f1f">宁德时代</text>
  <rect x="104" y="180" width="76" height="30" rx="15" fill="#ffffff" stroke="#e8eaed"/>
  <text x="142" y="200" text-anchor="middle" font-size="13" fill="#1f1f1f">行业观察</text>

  <!-- Annotation -->
  <rect x="0" y="760" width="375" height="52" fill="#f8f9fa"/>
  <text x="187" y="790" text-anchor="middle" font-size="12" fill="#5f6368">05b - 搜索页（历史搜索状态）</text>
</svg>
