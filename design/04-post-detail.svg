<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812">
  <defs>
    <style>
      text { font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="375" height="812" fill="#ffffff"/>

  <!-- Status Bar -->
  <text x="187" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1f1f">9:41</text>

  <!-- Header -->
  <rect y="44" width="375" height="48" fill="#ffffff"/>
  <text x="20" y="74" font-size="14" font-weight="500" fill="#1a73e8">← 返回</text>
  <rect x="280" y="56" width="80" height="28" rx="14" fill="#e8f0fe"/>
  <text x="320" y="75" text-anchor="middle" font-size="13" font-weight="500" fill="#1a73e8">☆ 收藏</text>
  <line x1="0" y1="92" x2="375" y2="92" stroke="#e8eaed"/>

  <!-- Meta -->
  <circle cx="40" cy="124" r="20" fill="#e8f0fe"/>
  <text x="40" y="129" text-anchor="middle" font-size="16" font-weight="600" fill="#1a73e8">苹</text>
  <text x="70" y="120" font-size="15" font-weight="600" fill="#1f1f1f">苹果</text>
  <text x="70" y="137" font-size="12" fill="#9aa0a6">2026-03-16 14:00</text>
  <rect x="290" y="112" width="56" height="22" rx="4" fill="#1a73e815"/>
  <text x="318" y="128" text-anchor="middle" font-size="11" font-weight="500" fill="#1a73e8">财报解读</text>

  <!-- Title -->
  <text x="20" y="184" font-size="20" font-weight="700" fill="#1f1f1f">苹果最新财报解读：</text>
  <text x="20" y="212" font-size="20" font-weight="700" fill="#1f1f1f">营收与利润分析</text>

  <!-- Content Section: 发生了什么 -->
  <text x="20" y="260" font-size="17" font-weight="600" fill="#1f1f1f">发生了什么</text>
  <line x1="20" y1="268" x2="355" y2="268" stroke="#e8eaed"/>
  <text x="20" y="292" font-size="15" fill="#1f1f1f" line-height="1.8">苹果发布了最新一期财报，整体业绩</text>
  <text x="20" y="314" font-size="15" fill="#1f1f1f">表现值得关注。</text>

  <!-- Content Section: 关键数据 -->
  <text x="20" y="358" font-size="17" font-weight="600" fill="#1f1f1f">关键数据</text>
  <line x1="20" y1="366" x2="355" y2="366" stroke="#e8eaed"/>
  <circle cx="32" cy="392" r="3" fill="#1a73e8"/>
  <text x="44" y="397" font-size="15" fill="#1f1f1f">营收方面：本季度营收保持稳定增长</text>
  <circle cx="32" cy="420" r="3" fill="#1a73e8"/>
  <text x="44" y="425" font-size="15" fill="#1f1f1f">利润方面：净利润率维持健康水平</text>
  <circle cx="32" cy="448" r="3" fill="#1a73e8"/>
  <text x="44" y="453" font-size="15" fill="#1f1f1f">现金流：经营性现金流表现良好</text>

  <!-- Content Section: 为什么重要 -->
  <text x="20" y="497" font-size="17" font-weight="600" fill="#1f1f1f">为什么重要</text>
  <line x1="20" y1="505" x2="355" y2="505" stroke="#e8eaed"/>
  <text x="20" y="529" font-size="15" fill="#1f1f1f">财报数据直接反映了公司的经营质量</text>
  <text x="20" y="551" font-size="15" fill="#1f1f1f">和发展趋势，是评估投资价值的重要</text>
  <text x="20" y="573" font-size="15" fill="#1f1f1f">依据。</text>

  <!-- Content Section: 对投资者意味着什么 -->
  <text x="20" y="617" font-size="17" font-weight="600" fill="#1f1f1f">对投资者意味着什么</text>
  <line x1="20" y1="625" x2="355" y2="625" stroke="#e8eaed"/>
  <text x="20" y="649" font-size="15" fill="#1f1f1f">投资者应重点关注公司的营收增速是</text>
  <text x="20" y="671" font-size="15" fill="#1f1f1f">否可持续，以及利润率的变化趋势。</text>

  <!-- Disclaimer -->
  <text x="20" y="720" font-size="13" fill="#9aa0a6" font-style="italic">以上分析基于公开信息，不构成投资建议。</text>
</svg>
