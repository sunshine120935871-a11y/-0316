<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812">
  <defs>
    <style>
      text { font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="375" height="812" fill="#ffffff"/>

  <!-- Status Bar -->
  <text x="187" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1f1f">9:41</text>

  <!-- Title -->
  <text x="20" y="90" font-size="22" font-weight="700" fill="#1f1f1f">添加自己感兴趣的公司</text>
  <text x="20" y="114" font-size="14" fill="#5f6368">系统将为您生成公司 Agent，持续跟踪公司动态</text>

  <!-- Input Row -->
  <rect x="20" y="140" width="260" height="44" rx="8" fill="#ffffff" stroke="#e8eaed"/>
  <text x="36" y="168" font-size="15" fill="#9aa0a6">输入公司名称</text>
  <rect x="290" y="140" width="65" height="44" rx="8" fill="#1a73e8"/>
  <text x="322" y="168" text-anchor="middle" font-size="14" font-weight="500" fill="#ffffff">添加</text>

  <!-- Selected Tags -->
  <rect x="20" y="200" width="56" height="30" rx="15" fill="#e8f0fe"/>
  <text x="42" y="220" text-anchor="middle" font-size="12" font-weight="500" fill="#1a73e8">苹果 ×</text>
  <rect x="84" y="200" width="68" height="30" rx="15" fill="#e8f0fe"/>
  <text x="112" y="220" text-anchor="middle" font-size="12" font-weight="500" fill="#1a73e8">特斯拉 ×</text>
  <rect x="160" y="200" width="56" height="30" rx="15" fill="#e8f0fe"/>
  <text x="182" y="220" text-anchor="middle" font-size="12" font-weight="500" fill="#1a73e8">茅台 ×</text>

  <!-- Suggestions Label -->
  <text x="20" y="270" font-size="13" fill="#5f6368">热门推荐</text>

  <!-- Suggestion Tags Row 1 -->
  <rect x="20" y="284" width="52" height="30" rx="15" fill="#ffffff" stroke="#e8eaed"/>
  <text x="46" y="304" text-anchor="middle" font-size="12" fill="#1f1f1f">苹果</text>
  <rect x="80" y="284" width="64" height="30" rx="15" fill="#ffffff" stroke="#e8eaed"/>
  <text x="112" y="304" text-anchor="middle" font-size="12" fill="#1f1f1f">特斯拉</text>
  <rect x="152" y="284" width="52" height="30" rx="15" fill="#ffffff" stroke="#e8eaed"/>
  <text x="178" y="304" text-anchor="middle" font-size="12" fill="#1f1f1f">茅台</text>
  <rect x="212" y="284" width="52" height="30" rx="15" fill="#ffffff" stroke="#e8eaed"/>
  <text x="238" y="304" text-anchor="middle" font-size="12" fill="#1f1f1f">腾讯</text>
  <rect x="272" y="284" width="76" height="30" rx="15" fill="#ffffff" stroke="#e8eaed"/>
  <text x="310" y="304" text-anchor="middle" font-size="12" fill="#1f1f1f">阿里巴巴</text>

  <!-- Suggestion Tags Row 2 -->
  <rect x="20" y="322" width="64" height="30" rx="15" fill="#ffffff" stroke="#e8eaed"/>
  <text x="52" y="342" text-anchor="middle" font-size="12" fill="#1f1f1f">比亚迪</text>
  <rect x="92" y="322" width="76" height="30" rx="15" fill="#ffffff" stroke="#e8eaed"/>
  <text x="130" y="342" text-anchor="middle" font-size="12" fill="#1f1f1f">宁德时代</text>
  <rect x="176" y="322" width="52" height="30" rx="15" fill="#ffffff" stroke="#e8eaed"/>
  <text x="202" y="342" text-anchor="middle" font-size="12" fill="#1f1f1f">美团</text>
  <rect x="236" y="322" width="64" height="30" rx="15" fill="#ffffff" stroke="#e8eaed"/>
  <text x="268" y="342" text-anchor="middle" font-size="12" fill="#1f1f1f">拼多多</text>

  <!-- Submit Button -->
  <rect x="20" y="400" width="335" height="48" rx="8" fill="#1a73e8"/>
  <text x="187" y="430" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">保存并生成 Agent（3）</text>

  <!-- Annotation -->
  <rect x="0" y="760" width="375" height="52" fill="#f8f9fa"/>
  <text x="187" y="790" text-anchor="middle" font-size="12" fill="#5f6368">02 - 首页 Onboarding（添加关注公司）</text>
</svg>
